<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet Tracer • ETH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
    body { font-family: 'Space Grotesk', sans-serif; }
    .neon-green { text-shadow: 0 0 15px #10b981; }
    .card { background: linear-gradient(145deg, #111827, #1f2937); }
    .scan-btn { transition: all 0.3s; }
    .scan-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #10b981; }
    .node { transition: all 0.3s; }
    .node:hover { transform: scale(1.08); }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen overflow-hidden">

  <div id="root" class="min-h-screen"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React

    const API_BASE = "http://localhost:8000"

    function truncate(str, start = 8, end = 6) {
      if (!str) return ""
      return str.length > start + end ? `${str.slice(0, start)}...${str.slice(-end)}` : str
    }

    function formatTime(ts) {
      if (!ts) return ""
      const date = new Date(ts)
      return date.toLocaleString('en-GB', { 
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      })
    }

    function App() {
      const [view, setView] = React.useState("dashboard")
      const [address, setAddress] = React.useState("0x6eb40eD52793Fb7ca5Cf7f17d48147299d49B70E")
      const [hops, setHops] = React.useState(1)
      const [limit, setLimit] = React.useState(10)
      const [data, setData] = React.useState(null)
      const [loading, setLoading] = React.useState(false)
      const [error, setError] = React.useState("")

      const fetchDashboard = async () => {
        if (!address) return
        setLoading(true)
        setError("")
        try {
          const res = await fetch(
            `${API_BASE}/api/v1/dashboard?address=${address}&hops=${hops}&limit=${limit}`
          )
          const json = await res.json()
          if (json.error) throw new Error(json.error)
          setData(json)
        } catch (e) {
          console.error(e)
          setError("Failed to fetch wallet data. Is backend running?")
          // Fallback mock data
          setData({
            wallet: address,
            currency: "ETH",
            balance: 12.845,
            is_smart_contract: false,
            transaction_count: 47,
            hops: hops,
            tx_limit: limit,
            transactions: [
              { from: "0x1234567890abcdef1234567890abcdef12345678", to: address, time: "2025-02-08T14:23:45Z", chain: "ethereum", hash: "0xabc123def456...", value: "1.250" },
              { from: address, to: "0x9876543210fedcba9876543210fedcba98765432", time: "2025-02-07T09:15:30Z", chain: "ethereum", hash: "0xdef789abc012...", value: "0.875" },
              { from: "0x1111111111111111111111111111111111111111", to: address, time: "2025-02-06T18:42:11Z", chain: "ethereum", hash: "0xghi345jkl678...", value: "3.100" },
            ]
          })
        }
        setLoading(false)
      }

      // Auto fetch when hops or limit changes
      useEffect(() => {
        if (data) fetchDashboard()
      }, [hops, limit])

      const showGraph = () => {
        if (!data) return
        setView("graph")
      }

      const backToDashboard = () => setView("dashboard")

      // Graph data processing
      const getGraphData = () => {
        if (!data || !data.transactions) return { nodes: [], edges: [] }

        const wallet = data.wallet.toLowerCase()
        const incoming = new Map()
        const outgoing = new Map()

        data.transactions.forEach(tx => {
          const f = tx.from.toLowerCase()
          const t = tx.to.toLowerCase()
          const val = parseFloat(tx.value) || 0

          if (t === wallet) {
            if (!incoming.has(f)) incoming.set(f, 0)
            incoming.set(f, incoming.get(f) + val)
          } else if (f === wallet) {
            if (!outgoing.has(t)) outgoing.set(t, 0)
            outgoing.set(t, outgoing.get(t) + val)
          }
        })

        const nodes = []
        const edges = []

        // Central wallet
        const center = {
          id: "center",
          label: truncate(data.wallet),
          value: data.balance,
          type: "center",
          x: 450,
          y: 280
        }
        nodes.push(center)

        // Senders (incoming)
        let y = 80
        incoming.forEach((val, addr) => {
          nodes.push({
            id: addr,
            label: truncate(addr),
            value: val,
            type: "sender",
            x: 120,
            y: y
          })
          edges.push({ from: addr, to: "center", value: val, type: "in" })
          y += 110
        })

        // Receivers (outgoing)
        y = 80
        outgoing.forEach((val, addr) => {
          nodes.push({
            id: addr,
            label: truncate(addr),
            value: val,
            type: "receiver",
            x: 780,
            y: y
          })
          edges.push({ from: "center", to: addr, value: val, type: "out" })
          y += 110
        })

        return { nodes, edges }
      }

      const graphData = view === "graph" ? getGraphData() : null

      return React.createElement("div", { className: "min-h-screen bg-zinc-950 text-emerald-300" },

        // DASHBOARD VIEW
        view === "dashboard" && React.createElement("div", { className: "p-8" },
          // Header
          React.createElement("div", { className: "flex items-center justify-between mb-10" },
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("div", { className: "w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-2xl" }, "⚡"),
              React.createElement("h1", { className: "text-4xl font-bold tracking-tighter neon-green" }, "WALLET TRACER")
            ),
            React.createElement("div", { className: "flex-1 max-w-2xl mx-12" },
              React.createElement("div", { className: "relative" },
                React.createElement("input", {
                  type: "text",
                  value: address,
                  onChange: e => setAddress(e.target.value),
                  placeholder: "Enter Ethereum address or ENS",
                  className: "w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-4 text-lg focus:outline-none focus:border-emerald-500 font-mono"
                }),
                React.createElement("button", {
                  onClick: fetchDashboard,
                  disabled: loading,
                  className: `absolute right-3 top-1/2 -translate-y-1/2 bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-10 py-3 rounded-xl scan-btn flex items-center gap-2 ${loading ? "opacity-50" : ""}`
                },
                  React.createElement("i", { className: "fas fa-search" }),
                  loading ? "SCANNING..." : "SCAN"
                )
              )
            )
          ),

          error && React.createElement("div", { className: "bg-red-900/50 border border-red-500 text-red-400 p-4 rounded-2xl mb-8" }, error),

          data && React.createElement("div", {},

            // Stats Cards
            React.createElement("div", { className: "grid grid-cols-4 gap-6 mb-12" },
              // Balance
              React.createElement("div", { className: "card border border-emerald-500/30 rounded-3xl p-6" },
                React.createElement("div", { className: "flex items-center gap-3 text-emerald-400 mb-3" },
                  React.createElement("i", { className: "fas fa-wallet text-2xl" }),
                  React.createElement("span", { className: "uppercase text-xs tracking-widest" }, "TOTAL BALANCE")
                ),
                React.createElement("div", { className: "text-5xl font-bold text-white" }, data.balance.toFixed(3), " ETH")
              ),

              // Transactions
              React.createElement("div", { className: "card border border-emerald-500/30 rounded-3xl p-6" },
                React.createElement("div", { className: "flex items-center gap-3 text-emerald-400 mb-3" },
                  React.createElement("i", { className: "fas fa-exchange-alt text-2xl" }),
                  React.createElement("span", { className: "uppercase text-xs tracking-widest" }, "TRANSACTIONS")
                ),
                React.createElement("div", { className: "text-5xl font-bold text-white" }, data.transaction_count)
              ),

              // Active Chains
              React.createElement("div", { className: "card border border-emerald-500/30 rounded-3xl p-6" },
                React.createElement("div", { className: "flex items-center gap-3 text-emerald-400 mb-3" },
                  React.createElement("i", { className: "fas fa-link text-2xl" }),
                  React.createElement("span", { className: "uppercase text-xs tracking-widest" }, "ACTIVE CHAINS")
                ),
                React.createElement("div", { className: "text-5xl font-bold text-white" }, "1")
              ),

              // Risk Score
              React.createElement("div", { className: "card border border-emerald-500/30 rounded-3xl p-6" },
                React.createElement("div", { className: "flex items-center gap-3 text-emerald-400 mb-3" },
                  React.createElement("i", { className: "fas fa-shield-alt text-2xl" }),
                  React.createElement("span", { className: "uppercase text-xs tracking-widest" }, "RISK SCORE")
                ),
                React.createElement("div", { className: "text-5xl font-bold text-emerald-400" }, "LOW")
              )
            ),

            // Wallet Summary
            React.createElement("div", { className: "mb-12" },
              React.createElement("div", { className: "flex items-center gap-3 mb-6" },
                React.createElement("div", { className: "text-emerald-400 text-xl font-bold" }, "► WALLET SUMMARY")
              ),
              React.createElement("div", { className: "bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-700" },
                React.createElement("table", { className: "w-full" },
                  React.createElement("thead", {},
                    React.createElement("tr", { className: "border-b border-zinc-700" },
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Wallet Address"),
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Currency"),
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Smart Contract"),
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Transactions (I/O)"),
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Receiver Address"),
                      React.createElement("th", { className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, "Final Balance")
                    )
                  ),
                  React.createElement("tbody", {},
                    React.createElement("tr", { className: "border-b border-zinc-800 hover:bg-zinc-800/50" },
                      React.createElement("td", { className: "px-8 py-6 font-mono" }, truncate(data.wallet)),
                      React.createElement("td", { className: "px-8 py-6" }, data.currency),
                      React.createElement("td", { className: "px-8 py-6" },
                        data.is_smart_contract 
                          ? React.createElement("span", { className: "bg-emerald-500/20 text-emerald-400 px-4 py-1 rounded-full text-xs font-bold" }, "YES")
                          : React.createElement("span", { className: "bg-red-500/20 text-red-400 px-4 py-1 rounded-full text-xs font-bold" }, "NO")
                      ),
                      React.createElement("td", { className: "px-8 py-6 font-mono" }, `${data.transaction_count} / ${Math.floor(data.transaction_count/2)} / ${Math.ceil(data.transaction_count/2)}`),
                      React.createElement("td", { className: "px-8 py-6 font-mono text-emerald-400" }, data.transactions.length ? truncate(data.transactions[0].to) : "—"),
                      React.createElement("td", { className: "px-8 py-6 font-bold text-white" }, data.balance.toFixed(3), " ETH")
                    )
                  )
                )
              )
            ),

            // Transaction Log
            React.createElement("div", {},
              React.createElement("div", { className: "flex items-center justify-between mb-6" },
                React.createElement("div", { className: "text-emerald-400 text-xl font-bold" }, "► TRANSACTION LOG"),
                React.createElement("div", { className: "flex items-center gap-6" },
                  React.createElement("div", { className: "flex items-center gap-3" },
                    React.createElement("span", { className: "text-xs uppercase tracking-widest text-zinc-500" }, "HOP COUNT"),
                    React.createElement("select", {
                      value: hops,
                      onChange: e => setHops(parseInt(e.target.value)),
                      className: "bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-2 focus:outline-none"
                    },
                      [1,2,3].map(n => React.createElement("option", { value: n }, n))
                    )
                  ),
                  React.createElement("button", {
                    onClick: showGraph,
                    className: "bg-emerald-500 hover:bg-emerald-600 text-black font-bold px-10 py-3 rounded-2xl flex items-center gap-3"
                  },
                    "SHOW GRAPH",
                    React.createElement("i", { className: "fas fa-arrow-right" })
                  )
                )
              ),

              React.createElement("div", { className: "bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-700" },
                React.createElement("table", { className: "w-full" },
                  React.createElement("thead", {},
                    React.createElement("tr", { className: "border-b border-zinc-700" },
                      ["FROM ADDRESS", "TO ADDRESS", "TIMESTAMP", "CURRENCY", "TX HASH", "VALUE"].map(h =>
                        React.createElement("th", { key: h, className: "px-8 py-5 text-left text-xs uppercase tracking-widest text-zinc-500" }, h)
                      )
                    )
                  ),
                  React.createElement("tbody", {},
                    data.transactions.map((tx, i) =>
                      React.createElement("tr", { key: i, className: "border-b border-zinc-800 hover:bg-zinc-800/50" },
                        React.createElement("td", { className: "px-8 py-6 font-mono" }, truncate(tx.from)),
                        React.createElement("td", { className: "px-8 py-6 font-mono" }, truncate(tx.to)),
                        React.createElement("td", { className: "px-8 py-6 text-zinc-400" }, formatTime(tx.time)),
                        React.createElement("td", { className: "px-8 py-6" }, tx.chain.toUpperCase()),
                        React.createElement("td", { className: "px-8 py-6 font-mono text-emerald-400" }, truncate(tx.hash, 10, 8)),
                        React.createElement("td", { className: "px-8 py-6 font-bold text-emerald-400" }, parseFloat(tx.value).toFixed(3), " ETH")
                      )
                    )
                  )
                )
              )
            )
          )
        ),

        // GRAPH VIEW
        view === "graph" && React.createElement("div", { className: "h-screen flex flex-col" },
          React.createElement("div", { className: "border-b border-zinc-800 bg-zinc-900 px-8 py-5 flex items-center justify-between" },
            React.createElement("button", {
              onClick: backToDashboard,
              className: "flex items-center gap-3 bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-2xl"
            },
              React.createElement("i", { className: "fas fa-arrow-left" }),
              "BACK"
            ),
            React.createElement("div", { className: "text-3xl font-bold tracking-widest neon-green" }, "TRANSACTION GRAPH"),
            React.createElement("div", { className: "text-zinc-500 text-sm" }, "[ INFINITE CANVAS – SCROLL TO ZOOM ]")
          ),

          React.createElement("div", { className: "flex-1 relative overflow-hidden bg-[#0a0f1a]" },
            // SVG Lines
            React.createElement("svg", {
              className: "absolute inset-0 w-full h-full pointer-events-none",
              style: { width: "100%", height: "100%" }
            },
              graphData.edges.map((edge, i) => {
                const fromNode = graphData.nodes.find(n => n.id === edge.from)
                const toNode = graphData.nodes.find(n => n.id === edge.to)
                if (!fromNode || !toNode) return null

                const x1 = fromNode.x + (edge.type === "in" ? 120 : 60)
                const y1 = fromNode.y + 35
                const x2 = toNode.x + (edge.type === "out" ? 0 : 60)
                const y2 = toNode.y + 35

                return React.createElement("g", { key: i },
                  React.createElement("line", {
                    x1, y1, x2, y2,
                    stroke: edge.type === "in" ? "#67e8f9" : "#f97316",
                    strokeWidth: "3",
                    strokeDasharray: edge.type === "in" ? "8 4" : "none",
                    opacity: 0.7
                  }),
                  React.createElement("text", {
                    x: (x1 + x2) / 2,
                    y: (y1 + y2) / 2 - 15,
                    fill: "#fff",
                    fontSize: "13",
                    fontWeight: "600",
                    textAnchor: "middle"
                  }, edge.value.toFixed(3), " ETH")
                )
              })
            ),

            // Nodes
            graphData.nodes.map(node =>
              React.createElement("div", {
                key: node.id,
                className: `node absolute px-8 py-6 rounded-3xl border-2 font-mono shadow-2xl flex flex-col items-center min-w-[180px]`,
                style: {
                  left: node.x + "px",
                  top: node.y + "px",
                  backgroundColor: node.type === "center" ? "#052e16" : "#111827",
                  borderColor: node.type === "center" ? "#10b981" : node.type === "sender" ? "#67e8f9" : "#c026d3",
                  color: node.type === "center" ? "#fff" : "#a5b4fc"
                }
              },
                node.type === "center" && React.createElement("div", { className: "text-5xl mb-3" }, "₿"),
                React.createElement("div", { className: "text-sm opacity-70" }, node.label),
                React.createElement("div", { className: "text-2xl font-bold mt-1" },
                  node.type === "center" ? node.value.toFixed(3) + " ETH" : node.value.toFixed(3) + " ETH"
                )
              )
            )
          )
        )
      )
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById("root"))
    root.render(React.createElement(App))
  </script>
</body>
